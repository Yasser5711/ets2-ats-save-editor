name: release

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  windows:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/windows.yml

  attach-executables:
    needs: [release-please, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: truck-save-editor-windows
          path: executables

      - name: attach the installer and the portable app to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mv executables/truck-save-editor-setup.exe "truck-save-editor-$TAG-desktop-setup.exe"
          mv executables/truck-save-editor.exe "truck-save-editor-$TAG-portable.exe"
          gh release upload "$TAG" "truck-save-editor-$TAG-desktop-setup.exe" "truck-save-editor-$TAG-portable.exe" --clobber
