name: ci

on:
  push:
    branches: [master]
  pull_request:
    # The release pull request only touches these files, and it is opened by the
    # workflow token: runs it triggers wait for a manual approval and are marked
    # failed after 30 days. Its commits were already tested when they reached
    # master, so a pull request that changes nothing else starts no run.
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - "**/package.json"
      - packages/desktop/src-tauri/tauri.conf.json
      - packages/desktop/src-tauri/Cargo.toml

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  windows:
    uses: ./.github/workflows/windows.yml
